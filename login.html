<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ТПА — Вход</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Golos+Text:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0f0f0d;
    --surface: #1a1a17;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #f0efe8;
    --text2: #8a8a80;
    --text3: #444440;
    --blue: #3b82f6;
    --red: #ef4444;
    --red-bg: rgba(239,68,68,0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Golos Text', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    animation: fadeUp 0.5s ease both;
  }

  .logo {
    text-align: center;
    margin-bottom: 28px;
  }

  .logo-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 60px; height: 60px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    border-radius: 16px;
    font-size: 26px;
    margin-bottom: 14px;
    box-shadow: 0 8px 32px rgba(59,130,246,0.3);
  }

  .logo-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #fff, var(--text2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo-sub {
    font-size: 13px;
    color: var(--text2);
    margin-top: 4px;
  }

  .field {
    margin-bottom: 14px;
  }

  .field label {
    display: block;
    font-size: 12px;
    color: var(--text2);
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .field input {
    width: 100%;
    height: 46px;
    padding: 0 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border2);
    border-radius: 10px;
    font-size: 15px;
    color: var(--text);
    font-family: 'Golos Text', sans-serif;
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance: none;
  }

  .field input:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  }

  .btn {
    width: 100%;
    height: 48px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Golos Text', sans-serif;
    cursor: pointer;
    margin-top: 8px;
    letter-spacing: 0.5px;
    transition: opacity 0.15s, transform 0.15s;
    box-shadow: 0 4px 16px rgba(59,130,246,0.25);
  }

  .btn:active { opacity: 0.85; transform: scale(0.98); }

  .error {
    background: var(--red-bg);
    border: 1px solid rgba(239,68,68,0.3);
    color: #fca5a5;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    margin-top: 12px;
    display: none;
    text-align: center;
  }

  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}
    60%{transform:translateX(-5px)}
    80%{transform:translateX(5px)}
  }

  .shake { animation: shake 0.4s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="card" id="login-card">
  <div class="logo">
    <div class="logo-icon">⚙️</div>
    <div class="logo-title">ТПА ТРЕКЕР</div>
    <div class="logo-sub">Система учёта продукции цеха</div>
  </div>

  <div class="field">
    <label>Логин</label>
    <input type="text" id="username" placeholder="Введите логин" autocomplete="username" autocapitalize="none">
  </div>

  <div class="field">
    <label>Пароль</label>
    <input type="password" id="password" placeholder="Введите пароль" autocomplete="current-password">
  </div>

  <!-- Показывается, только если на этом устройстве ещё не сохранён URL Apps Script -->
  <div class="field" id="gs-url-field" style="display:none">
    <label>URL Apps Script (один раз)</label>
    <input type="url" id="gs-url" placeholder="https://script.google.com/macros/s/.../exec" autocapitalize="none">
  </div>

  <button class="btn" id="btn-login" onclick="doLogin()">Войти →</button>

  <div class="error" id="error-msg">❌ Неверный логин или пароль</div>
</div>

<script>
// ✅ Пароли НЕ хранятся в коде: проверка в Apps Script (handleLogin, Свойства скрипта).
// Без связи — вход по отпечатку (SHA-256) последнего удачного входа на этом устройстве.

var ROUTES = {
  'admin':    'home.html',
  'operator': 'index.html'
};

// Если уже залогинен — редиректим
(function() {
  var session = getSession();
  if (session) redirect(session.role);
})();

function getSession() {
  try { return JSON.parse(sessionStorage.getItem('tpa_session')); } catch(e) { return null; }
}

function redirect(role) {
  window.location.href = ROUTES[role] || 'index.html';
}

// URL Apps Script: берём любой уже сохранённый на устройстве (форма / дашборд / KPI)
function findGsUrl() {
  try {
    return localStorage.getItem('tpa_gs_url') || localStorage.getItem('dash_gs_url') ||
           localStorage.getItem('kpi_gs_url') || '';
  } catch(e) { return ''; }
}

if (!findGsUrl()) document.getElementById('gs-url-field').style.display = 'block';

function sha256(text) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function(b) {
      return ('0' + b.toString(16)).slice(-2);
    }).join('');
  });
}

function loadAuthCache() {
  try { return JSON.parse(localStorage.getItem('tpa_auth_cache') || '{}'); } catch(e) { return {}; }
}

function loginOk(username, role) {
  sessionStorage.setItem('tpa_session', JSON.stringify({ username: username, role: role }));
  redirect(role);
}

function showError(text) {
  var errorEl = document.getElementById('error-msg');
  var card = document.getElementById('login-card');
  errorEl.textContent = text;
  errorEl.style.display = 'block';
  card.classList.remove('shake');
  void card.offsetWidth;
  card.classList.add('shake');
  document.getElementById('password').value = '';
  document.getElementById('password').focus();
}

function setBusy(busy) {
  var btn = document.getElementById('btn-login');
  btn.disabled = busy;
  btn.textContent = busy ? '⏳ Проверка...' : 'Войти →';
}

// Без связи: сверяем с отпечатком последнего удачного входа
function offlineLogin(username, password) {
  var cached = loadAuthCache()[username];
  if (!cached) { showError('📵 Нет связи. Первый вход на этом устройстве — только с интернетом.'); return; }
  sha256(username + ':' + password).then(function(h) {
    if (h === cached.hash) loginOk(username, cached.role);
    else showError('❌ Неверный логин или пароль');
  });
}

function doLogin() {
  var username = document.getElementById('username').value.trim().toLowerCase();
  var password = document.getElementById('password').value;
  document.getElementById('error-msg').style.display = 'none';
  if (!username || !password) { showError('Введите логин и пароль'); return; }

  var url = findGsUrl();
  if (!url) {
    url = document.getElementById('gs-url').value.trim();
    if (!/^https:\/\/script\.google\.com\//.test(url)) { showError('Вставьте URL Apps Script'); return; }
  }

  setBusy(true);
  // text/plain — «простой» запрос, Apps Script отдаёт ответ без CORS-ошибки
  fetch(url, { method: 'POST', body: JSON.stringify({ action: 'login', username: username, password: password }) })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      setBusy(false);
      if (res.status === 'ok' && ROUTES[res.role]) {
        try {
          if (!findGsUrl()) localStorage.setItem('tpa_gs_url', url);
        } catch(e) {}
        sha256(username + ':' + password).then(function(h) {
          var cache = loadAuthCache();
          cache[username] = { hash: h, role: res.role };
          try { localStorage.setItem('tpa_auth_cache', JSON.stringify(cache)); } catch(e) {}
          loginOk(username, res.role);
        });
      } else if (res.status === 'locked') {
        showError('🔒 Слишком много попыток. Подождите 10 минут.');
      } else if (res.status === 'ok') {
        showError('⚠️ Apps Script не обновлён — нет функции входа');
      } else {
        showError('❌ Неверный логин или пароль');
      }
    })
    .catch(function() {
      setBusy(false);
      offlineLogin(username, password);
    });
}

// Enter key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>

</body>
</html>
